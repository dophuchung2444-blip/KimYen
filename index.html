<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dành Cho Cậu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9ec4,#ffd6e7);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:25px;
    color:white;
    max-width:700px;
}

h1{
    font-size:3em;
    margin-bottom:20px;
}

p{
    font-size:1.3em;
    line-height:1.8;
}

button{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
}

#yes{
    background:white;
}

#no{
    position:absolute;
    background:#ff4f81;
    color:white;
}

.heart{
    position:absolute;
    color:red;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Gửi đến cậu ❤️</h1>

    <p>
        Có thể đây không phải cách hoàn hảo nhất,<br>
        nhưng tớ muốn nói rằng...<br><br>

        Tớ thích cậu rất nhiều. 🌷
    </p>

    <button id="yes" onclick="accept()">Đồng ý 💕</button>
</div>

<button id="no">Không 😶</button>

<script>
function accept(){
    document.body.innerHTML=`
    <div style="
    text-align:center;
    color:white;
    font-family:Arial;
    ">
    <h1 style="font-size:60px">❤️</h1>
    <h1>Cảm ơn cậu!</h1>
    <p>Tớ sẽ cố gắng làm cậu hạnh phúc ✨</p>
    </div>`;
}

const noBtn=document.getElementById("no");

noBtn.addEventListener("mouseover",()=>{
    noBtn.style.left=Math.random()*90+"vw";
    noBtn.style.top=Math.random()*90+"vh";
});

function createHeart(){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";
    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);
}

setInterval(createHeart,300);
</script>

</body>
</html>
