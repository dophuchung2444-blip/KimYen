<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dành riêng cho bà chã</title>

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff7eb3,#ff758c);
    font-family:Arial,sans-serif;
}

.box{
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:25px;
    text-align:center;
    color:white;
    width:90%;
    max-width:700px;
}

h1{
    font-size:40px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
    margin:10px;
}

#yes{
    background:white;
}

#no{
    position:absolute;
    background:#ff1744;
    color:white;
}

.heart{
    position:absolute;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="box">
    <h1>Gửi Nguyễn Trần Kim Yến<p style="color: red;">(bà chã iu)</p></h1>

    <p>
        Tớ đã suy nghĩ rất lâu mới dám làm trang web này.<br><br>
        Tớ thích cậu rất nhiều 🌷
    </p>

    <h3 id="days"></h3>

    <button id="yes" onclick="yes()">Có đồng ý</button>
</div>

<button id="no">Deoo(mặt cười khinh)</button>

<script>

// Đổi ngày này thành ngày m gặp crush
const startDate = new Date("2025-11-01");

const today = new Date();

const diff = Math.floor(
(today - startDate)/(1000*60*60*24)
);

document.getElementById("days").innerHTML =
`Từ lúc tụi mình có mối quan hệ này cũng đã ${diff} ngày ❤️`;

function yes(){
document.body.innerHTML=`
<div style="
text-align:center;
color:white;
font-family:Arial;
">
<h1>thiệt khongg</h1>
<h1>Chấp nhận ròi đáy nháaaa</h1>
<h2>Tui đảm bảo từ thời điểm bây giờ trở đi tui sẽ trân trọng Kim Yến hết nhất trên đời khong để phải thiệt thòi dauuu 💕</h2>
</div>
`;
}

const noBtn=document.getElementById("no");

noBtn.addEventListener("mouseover",()=>{
noBtn.style.left=Math.random()*90+"vw";
noBtn.style.top=Math.random()*90+"vh";
});

function heart(){
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*30)+"px";
document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},6000);
}

setInterval(heart,250);

</script>

</body>
</html>
